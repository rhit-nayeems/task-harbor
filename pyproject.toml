[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opus-harbor"
version = "0.3.0"
description = "Claude-only backlog orchestrator for planning, implementation, QA, escalation, and periodic code review."
requires-python = ">=3.11"
authors = [{name = "rhit-nayeems"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/rhit-nayeems/opus-harbor"
Issues = "https://github.com/rhit-nayeems/opus-harbor/issues"

[project.scripts]
opus-harbor = "opus_manager.cli:main"
opus-manager = "opus_manager.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opus_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
