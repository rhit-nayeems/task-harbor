[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "task-harbor"
version = "0.4.0"
description = "Claude and GPT backlog orchestrator for planning, implementation, QA, escalation, and periodic code review."
requires-python = ">=3.11"
authors = [{name = "rhit-nayeems"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["textual>=1,<2"]

[project.urls]
Repository = "https://github.com/rhit-nayeems/task-harbor"
Issues = "https://github.com/rhit-nayeems/task-harbor/issues"

[project.scripts]
task-harbor = "opus_manager.cli:main"
opus-harbor = "opus_manager.cli:main"
opus-manager = "opus_manager.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opus_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
