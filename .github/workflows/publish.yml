name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match package version'
          PY
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test installed wheel outside source checkout
        run: |
          python -m venv /tmp/harbor-package-test
          /tmp/harbor-package-test/bin/pip install dist/*.whl pytest
          cd /tmp
          /tmp/harbor-package-test/bin/task-harbor --version
          /tmp/harbor-package-test/bin/task-harbor guide
          /tmp/harbor-package-test/bin/task-harbor setup --help
          /tmp/harbor-package-test/bin/task-harbor demo
          /tmp/harbor-package-test/bin/python -m task_harbor runs --json
          /tmp/harbor-package-test/bin/python -m pytest "$GITHUB_WORKSPACE/tests"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/task-harbor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
