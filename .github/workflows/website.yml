name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: node --check app.js
      - run: npm run build
      - run: npx cf deploy --dry-run
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check live website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          for file in index.html style.css app.js mark.svg; do
            for attempt in {1..6}; do
              curl --location --fail --silent --show-error --retry 3 --retry-all-errors \
                "https://task-harbor.sk-naimulnayeem.workers.dev/$file" -o "/tmp/$file"
              if cmp --silent "dist/$file" "/tmp/$file"; then
                break
              fi
              sleep 5
            done
            cmp "dist/$file" "/tmp/$file"
          done
